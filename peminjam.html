<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Peminjam - KasWaroeng</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="css/style.css">

    <!-- PWA Settings -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KasWaroeng">

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker Registered!', reg))
        .catch(err => console.error('Service Worker Registration Failed!', err));
    });
  }
</script>


</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <header class="header">
            <div class="brand" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                <h1>Data Peminjam</h1>
                <a href="index.html" class="back-btn" title="Kembali ke Dashboard">
                    <span class="material-symbols-outlined">arrow_back</span>
                </a>
            </div>
        </header>

        <!-- CARD RINGKASAN TOTAL -->
        <div class="card card-stacked" style="margin-bottom: 20px;">
            <div class="metric-section">
                <span class="metric-label orange-text">Total Saldo Yang Pinjaman</span>
                <div class="metric-value orange-text" id="dispTotalSemuaPinjaman">Rp. 0</div>
            </div>
        </div>

        <!-- TABEL DATA 12 PEMINJAM -->
        <div class="card card-stacked">
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th style="text-align: right;">Jumlah Yang Dipinjam</th>
                        </tr>
                    </thead>
                    <tbody id="peminjamPageTableBody">
                        <!-- 12 Data Peminjam akan dimuat otomatis oleh JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script type="module" src="js/peminjam.js"></script>
</body>
</html>
